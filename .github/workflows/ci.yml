name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are worth cancelling; a run on main is not, because it
  # carries the deploy job and cancelling mid-upload can strand the site on a
  # partial artifact.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Each check is its own job so a branch ruleset can require them individually.
  # The job `name` is the status-check context — renaming one silently drops the
  # corresponding required check from the ruleset.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run test

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Husky runs prettier on commit, but `git commit --no-verify` skips it.
      - run: npx prettier --check .

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: npm run build
        env:
          VITE_BASE: /
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: test-anon-key

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # Blocking floor, green as of #93. `high` is deliberately *not* the
      # threshold: two high advisories survive that no dependency bump can
      # clear, and a permanently red gate is one nobody reads.
      #
      #   - js-yaml 3.13.1, pinned exactly by @vercel/frameworks inside
      #     @sanity/cli. CLI-only code; this project builds with Vite and
      #     deploys to Pages, so it never parses YAML through that path.
      #   - GHSA-qwww-vcr4-c8h2, react-router RSC-mode CSRF. Fixed in
      #     react-router 8.3.0, which deprecates react-router-dom — a migration,
      #     not a bump. The app is a client-only SPA and never runs RSC mode.
      #
      # Raise this to `high` once either is genuinely resolved.
      - name: Fail on critical advisories
        run: npm audit --audit-level=critical

      # Everything under the blocking floor, for visibility only. Dependabot
      # (.github/dependabot.yml) is what actually keeps this list short.
      - name: Report remaining advisories
        if: always()
        continue-on-error: true
        run: npm audit

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest

    # The smoke suite itself runs in about 30 seconds. This ceiling is here for
    # the step below it: when an Ubuntu mirror or the browser CDN stalls, the
    # job otherwise sits on the default six-hour timeout with a green-ish
    # "in progress" and blocks the PR silently. Fifteen minutes is roughly
    # twenty times the healthy run and turns that into a legible failure.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # Deliberately not `--with-deps`. That flag shells out to `apt-get`, and
      # on 2026-08-19 the runners' Ubuntu mirror went unreachable: apt spent
      # 29 minutes retrying and falling back before the 23-second test run,
      # on this branch and on `main` alike. The GitHub-hosted `ubuntu-latest`
      # image ships Google Chrome, so Chromium's shared libraries are already
      # present and the apt round trip bought nothing.
      #
      # If a future image does drop them, this fails loudly rather than
      # silently: Playwright refuses to launch and prints the exact packages
      # it wants, at which point `npx playwright install-deps chromium` is the
      # narrow fix — not the blanket flag.
      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Run smoke tests
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Deploy lives here rather than in its own workflow so it can `needs:` the
  # checks directly. As a separate workflow on the same `push` trigger it raced
  # them, and a red CI still shipped to Pages.
  #
  # `audit` is intentionally absent from `needs:`. It is a blocking check on
  # pull requests, which is where a bad dependency should be stopped. Wiring it
  # here as well would let an advisory published upstream overnight block the
  # deploy of an unrelated change, for a static bundle the advisory does not
  # affect.
  deploy:
    name: Deploy to GitHub Pages
    needs: [lint, typecheck, test, format, build, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    # Not cancel-in-progress: cancelling a half-finished Pages deploy can leave
    # the site on a partially uploaded artifact.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Build
        run: |
          npm run build
          cp dist/index.html dist/404.html
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
