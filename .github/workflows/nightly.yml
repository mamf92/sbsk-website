name: Nightly rebuild

# The site is static, so `kalender.ics` (the calendar subscription feed, built from Sanity by
# vite.config.ts) is only as fresh as the last deploy. This rebuilds `main` and redeploys it every
# night, so an event an editor adds in the Studio reaches subscribers' calendars by morning
# without anyone merging anything. It rebuilds the newest `main` commit that CI itself deployed
# (its checks all passed), never a newer one whose checks failed, so it runs no checks of its own.

on:
  schedule:
    # 02:17 UTC: 03:17 in Oslo in winter, 04:17 in summer. Off the hour, as GitHub asks.
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Rebuild and deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write

    # Shares CI's group, so a nightly run and a merge's deploy never upload at the same time.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Find the last commit CI deployed
        id: deployed
        env:
          GH_TOKEN: ${{ github.token }}
        # CI's deploy job only runs when every check passed, so a successful push run on main is
        # a commit that is safe to rebuild.
        run: |
          sha="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --event push --status success --limit 1 --json headSha --jq '.[0].headSha')"
          if [ -z "$sha" ]; then echo "No successful CI run on main" >&2; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.deployed.outputs.sha }}
      - uses: ./.github/actions/setup

      - name: Build live site and redesign preview
        uses: ./.github/actions/build-site
        with:
          supabase-url: ${{ vars.VITE_SUPABASE_URL }}
          supabase-publishable-key: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
