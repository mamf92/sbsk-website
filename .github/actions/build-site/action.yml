name: Build site
description: >-
  Build the live site from the current checkout into ./dist, then build the same checkout again
  with the redesign flag on into ./dist/redesign/ as a noindex preview. Both share one GitHub Pages deployment,
  because a repository only gets one Pages site and each deploy replaces the whole of it: the
  live build and the preview have to be uploaded together or one wipes the other.

# The caller checks out `main` and runs ./.github/actions/setup first.

inputs:
  supabase-url:
    description: VITE_SUPABASE_URL for both builds.
    required: true
  supabase-publishable-key:
    description: VITE_SUPABASE_PUBLISHABLE_KEY for both builds.
    required: true

runs:
  using: composite
  steps:
    - name: Build live site
      # public/404.html (the GitHub Pages SPA-routing fallback, #22) is copied into dist/ by
      # Vite automatically — it must not be overwritten with a copy of index.html here, which
      # is what used to serve every deep link with a bare 404 status instead of the redirect.
      shell: bash
      run: npm run build
      env:
        VITE_BASE: /${{ github.event.repository.name }}/
        VITE_SUPABASE_URL: ${{ inputs.supabase-url }}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${{ inputs.supabase-publishable-key }}
        # Member portal on (26 Nov 2026, opened for testing): the Bli medlem form, board
        # approval in the member list, member sign-up at /lag-medlemsprofil and the legal
        # pages. Sign-up stays invite-only: the on_auth_user_created_before trigger refuses
        # any email that is not an active row in members.
        VITE_ENABLE_MEMBER_PORTAL: 'true'
        # Implied by the flag above; kept so turning the portal off again leaves the board's
        # URL-only routes (/login, /styreportal) in place.
        VITE_ENABLE_PORTAL_ROUTES: 'true'
        # Nothing reads the messages the Kontakt oss form writes yet (#254) — the page
        # publishes the club's address instead until #133 or portal access lands.
        VITE_ENABLE_CONTACT_FORM: 'false'
        # The language toggle and English event pages (phase 1, #185): only /board-game-masters
        # and /arrangementer/:id are translated, and the toggle shows only there.
        VITE_ENABLE_I18N: 'true'

    - name: Build redesign preview
      # The same `main` checkout built a second time with VITE_ENABLE_REDESIGN on, so the preview
      # shows the new front page and calendar on today's code and data (27 Nov 2026). It used to
      # build the old `redesign` branch, which stopped at 12 Nov and is kept only for reference.
      # Every other flag matches the live build. Only the root 404.html is ever served by Pages;
      # it routes /<repo>/redesign/* deep links here.
      shell: bash
      env:
        VITE_BASE: /${{ github.event.repository.name }}/redesign/
        VITE_SUPABASE_URL: ${{ inputs.supabase-url }}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${{ inputs.supabase-publishable-key }}
        VITE_ENABLE_MEMBER_PORTAL: 'true'
        VITE_ENABLE_PORTAL_ROUTES: 'true'
        VITE_ENABLE_CONTACT_FORM: 'false'
        VITE_ENABLE_I18N: 'true'
        VITE_ENABLE_REDESIGN: 'true'
      run: |
        live="$(mktemp -d)"
        mv dist "$live/dist"
        npm run build
        rm -f dist/404.html
        # Keep the preview out of search results; robots.txt can't do it from a project subpath.
        sed -i 's|<head>|<head><meta name="robots" content="noindex, nofollow">|' dist/index.html
        mv dist "$live/dist/redesign"
        mv "$live/dist" dist
