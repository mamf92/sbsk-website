name: Setup
description: Install Node and project dependencies from the lockfile.

# Note: this action cannot check the repository out itself. A local `uses:`
# path is only resolvable once the workspace exists, so every caller has to run
# actions/checkout before referencing this action.

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: npm

    - name: Install deps
      shell: bash
      run: npm ci
